[tool.poetry]
name = "next"
version = "1.0.0"
description = ""
authors = [
    "Márcio Marques",
    "Leonardo Mendonça",
    "Leonardo M. Moreira",
    "Christian Junior de Oliveira",
    "Vitor Balestro",
    "Tiago Novello",
    "Daniel Yukimura",
    "Pavel Petrov",
    "Lucas Nissenbaum",
]
packages = [
    { include = "basis" },
    { include = "models" },
    { include = "utilities" },
    { include = "groundtruth_methods"},
